name: Content Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate content structure and quality
        run: bun run validate:all-content
      - name: Validate locales
        run: bun run check:locales
      - name: Run tests
        run: bun test
      - name: Type check
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: bun run build
