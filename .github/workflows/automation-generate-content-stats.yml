name: Automation generate content stats

on:
  push:
    branches:
      - automation/question-expansion-2

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run generate:content-stats
      - name: Commit generated stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config/content-stats.ts docs/content-inventory.json
          git diff --cached --quiet || git commit -m 'Regenerate content stats'
          git push origin HEAD:automation/question-expansion-2
