name: Sync Generated Content

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/content/**'
      - 'scripts/generate-question-loaders.ts'
      - 'scripts/generate-content-stats.ts'

permissions:
  contents: read

concurrency:
  group: generated-content-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: regenerate-content-read-only
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate repository-owned content artifacts
        run: |
          bun run generate:question-loaders
          bun run generate:content-stats

      - name: Detect generated changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          paths=(
            src/content/question-loaders.ts
            src/config/content-stats.ts
            docs/content-inventory.json
          )

          if git diff --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated content artifacts are already current."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          tar -czf /tmp/generated-content.tgz "${paths[@]}"

      - name: Upload generated artifacts
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-${{ github.event.pull_request.head.sha }}
          path: /tmp/generated-content.tgz
          retention-days: 1
          if-no-files-found: error

  commit:
    name: commit-generated-content
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-content-${{ github.event.pull_request.head.sha }}
          path: /tmp/generated-content

      - name: Apply and commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail

          tar -xzf /tmp/generated-content/generated-content.tgz

          git add src/content/question-loaders.ts src/config/content-stats.ts docs/content-inventory.json

          if git diff --cached --quiet; then
            echo "Generated content artifacts became current before commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Content: regenerate canonical inventory"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Validate regenerated PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run merge-gate.yml --ref "$PR_BRANCH"
