name: Site integrity

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/pages/**'
      - 'src/components/layout/**'
      - 'src/components/QuizHeader.tsx'
      - 'src/components/Footer.tsx'
      - 'src/components/HomeScreen.tsx'
      - 'src/config/fields.ts'
      - 'src/config/site-navigation.ts'
      - 'src/test/site-structure.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/site-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/pages/**'
      - 'src/components/layout/**'
      - 'src/components/QuizHeader.tsx'
      - 'src/components/Footer.tsx'
      - 'src/components/HomeScreen.tsx'
      - 'src/config/fields.ts'
      - 'src/config/site-navigation.ts'
      - 'src/test/site-structure.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/site-integrity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate site structure
        run: bun run validate:site
