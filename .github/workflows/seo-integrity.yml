name: SEO integrity

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate SEO route and discovery integrity
        run: bun run validate:seo

      - name: Build production app with prerendered heads
        run: bun run build

      - name: Validate prerendered route output
        run: bun run validate:prerender
