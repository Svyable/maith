name: SEO integrity

on:
  pull_request:
    paths:
      - 'index.html'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'src/App.tsx'
      - 'src/components/SeoManager.tsx'
      - 'src/config/seo.ts'
      - 'scripts/validate-seo.ts'
      - 'package.json'
      - '.github/workflows/seo-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'src/App.tsx'
      - 'src/components/SeoManager.tsx'
      - 'src/config/seo.ts'
      - 'scripts/validate-seo.ts'
      - 'package.json'
      - '.github/workflows/seo-integrity.yml'

permissions:
  contents: read

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate SEO route and discovery integrity
        run: bun run validate:seo
