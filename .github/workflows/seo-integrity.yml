name: SEO integrity

on:
  pull_request:
    paths:
      - 'index.html'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'src/App.tsx'
      - 'src/components/SeoManager.tsx'
      - 'src/config/seo.ts'
      - 'src/config/learning-pages.ts'
      - 'src/config/site-navigation.ts'
      - 'src/pages/Learn.tsx'
      - 'src/pages/Index.tsx'
      - 'src/config/content-registry.ts'
      - 'src/config/content-stats.ts'
      - 'scripts/generate-seo-artifacts.ts'
      - 'scripts/prerender-seo.ts'
      - 'scripts/validate-prerender.ts'
      - 'scripts/validate-seo.ts'
      - 'package.json'
      - '.github/workflows/seo-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - 'src/App.tsx'
      - 'src/components/SeoManager.tsx'
      - 'src/config/seo.ts'
      - 'src/config/learning-pages.ts'
      - 'src/config/site-navigation.ts'
      - 'src/pages/Learn.tsx'
      - 'src/pages/Index.tsx'
      - 'src/config/content-registry.ts'
      - 'src/config/content-stats.ts'
      - 'scripts/generate-seo-artifacts.ts'
      - 'scripts/prerender-seo.ts'
      - 'scripts/validate-prerender.ts'
      - 'scripts/validate-seo.ts'
      - 'package.json'
      - '.github/workflows/seo-integrity.yml'

permissions:
  contents: read

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate SEO route and discovery integrity
        run: bun run validate:seo

      - name: Build production app with prerendered heads
        run: bun run build

      - name: Validate prerendered route output
        run: bun run validate:prerender
