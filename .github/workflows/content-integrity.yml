name: Content integrity

on:
  pull_request:
    paths:
      - 'src/content/**'
      - 'src/i18n/**'
      - 'scripts/**'
      - 'docs/localization.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/content-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'src/content/**'
      - 'src/i18n/**'
      - 'scripts/**'
      - 'docs/localization.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/content-integrity.yml'

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate localized and canonical content
        run: bun run validate:all-content
