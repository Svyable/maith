name: App CI

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/domain/**'
      - 'src/hooks/**'
      - 'src/pages/**'
      - 'src/test/**'
      - 'src/config/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/app-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/components/**'
      - 'src/domain/**'
      - 'src/hooks/**'
      - 'src/pages/**'
      - 'src/test/**'
      - 'src/config/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build
