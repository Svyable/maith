name: App CI

on:
  workflow_call:
    inputs:
      run_build:
        description: Run the production build in this workflow.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run_build:
        description: Run the production build.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build production app
        if: inputs.run_build
        run: bun run build
